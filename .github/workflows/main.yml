name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Merge HTML parts and arrange project
        run: |
          mkdir -p www
          cat index.part.aa index.part.ab index.part.ac > www/index.html
          echo "حجم الملف بعد الدمج:"
          ls -lh www/index.html
          head -c 50 www/index.html
          rm -f index.part.aa index.part.ab index.part.ac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package .app into unsigned .ipa
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r -y ../../../../../../app-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaos-unsigned-ipa
          path: app-unsigned.ipa
          retention-days: 30

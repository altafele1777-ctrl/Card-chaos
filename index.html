<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسواق الفكهاني — لوحة الطلبات</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --green:#2e7d32;--green-dark:#1b5e20;--green-light:#e8f3e9;
  --cream:#fbf8f0;--ink:#26331f;--orange:#e8743b;--red:#d8503a;
  --card:#ffffff;--line:#e3e8de;
  --shadow:0 4px 18px rgba(27,94,32,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--cream);
  color:var(--ink);line-height:1.5;padding-bottom:20px}

/* ===== الهيدر ===== */
header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
  padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header .ttl{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
header .live{display:flex;align-items:center;gap:6px;font-size:12px;
  background:rgba(255,255,255,.18);padding:5px 11px;border-radius:20px}
header .dot{width:8px;height:8px;border-radius:50%;background:#7CFC9A;
  animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

/* ===== الإحصائيات ===== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);
  border-right:4px solid var(--green)}
.stat.amber{border-color:var(--orange)}
.stat.dark{border-color:var(--green-dark)}
.stat.red{border-color:var(--red)}
.stat .lbl{font-size:12px;color:#7a857a;margin-bottom:4px}
.stat .val{font-size:24px;font-weight:800;color:var(--green-dark)}
.stat .val small{font-size:13px;font-weight:600;color:#7a857a}
.stat .sub{font-size:11px;color:#9aa39a;margin-top:2px}

/* ===== الأزرار العلوية ===== */
.bar{display:flex;gap:8px;padding:4px 16px 12px;flex-wrap:wrap}
.bar button{flex:1;min-width:110px;border:1.5px solid var(--line);background:#fff;
  color:var(--ink);border-radius:12px;padding:10px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.bar button.primary{background:var(--green);color:#fff;border-color:var(--green)}
.bar button.warn{background:#fff5f0;color:var(--red);border-color:#f0c8bc}
.bar button:active{transform:scale(.97)}

/* ===== قسم العنوان ===== */
.section-h{padding:8px 18px;font-size:15px;font-weight:800;color:var(--green-dark);
  display:flex;align-items:center;justify-content:space-between}
.section-h .count{background:var(--green-light);color:var(--green-dark);
  padding:2px 10px;border-radius:12px;font-size:13px}

/* ===== الطلبات ===== */
.orders{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.order{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  border:1.5px solid var(--line)}
.order.new{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,116,59,.15),var(--shadow);
  animation:pop .4s}
@keyframes pop{0%{transform:scale(.95);opacity:.6}100%{transform:scale(1);opacity:1}}
.order .top{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--green-light)}
.order .top .who{font-weight:800;font-size:15px}
.order .top .time{font-size:12px;color:#7a857a}
.order .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.badge.b-new{background:var(--orange);color:#fff}
.badge.b-prep{background:#f0a500;color:#fff}
.badge.b-done{background:var(--green);color:#fff}
.order .body{padding:12px 14px}
.order .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.order .row .q{color:#7a857a}
.order .meta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:13px;color:#56604f;display:flex;flex-direction:column;gap:4px}
.order .meta a{color:var(--green-dark);font-weight:700;text-decoration:none}
.order .tot{display:flex;justify-content:space-between;margin-top:10px;
  font-size:17px;font-weight:800;color:var(--green-dark)}
.order .acts{display:flex;gap:8px;padding:0 14px 14px}
.order .acts button{flex:1;border:none;border-radius:11px;padding:11px;font-size:13px;
  font-weight:700;cursor:pointer;font-family:inherit}
.acts .prep{background:#fff4d6;color:#9a6a00}
.acts .done{background:var(--green);color:#fff}
.acts .call{background:#25d366;color:#fff}
.order .acts button:active{transform:scale(.97)}

.empty{text-align:center;color:#9aa39a;padding:50px 20px;font-size:15px}
.empty .big{font-size:46px;margin-bottom:10px}

/* ===== شريط الصوت ===== */
.soundbar{position:fixed;bottom:0;left:0;right:0;background:#fff3cd;color:#7a5b00;
  padding:12px 16px;display:none;align-items:center;justify-content:space-between;
  gap:10px;z-index:40;box-shadow:0 -3px 12px rgba(0,0,0,.1);font-size:13px}
.soundbar.show{display:flex}
.soundbar button{background:var(--green);color:#fff;border:none;border-radius:10px;
  padding:9px 16px;font-weight:700;cursor:pointer;font-family:inherit}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:var(--green-dark);color:#fff;padding:12px 22px;border-radius:14px;
  font-weight:700;z-index:60;opacity:0;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="ttl">🛒 لوحة الطلبات</div>
  <div class="live"><span class="dot"></span> متصل</div>
</header>

<!-- الإحصائيات -->
<div class="stats">
  <div class="stat">
    <div class="lbl">طلبات اليوم</div>
    <div class="val" id="stToday">0</div>
    <div class="sub" id="stPending">0 قيد التنفيذ</div>
  </div>
  <div class="stat dark">
    <div class="lbl">مبيعات اليوم</div>
    <div class="val"><span id="stSales">0</span> <small>دينار</small></div>
    <div class="sub">من الطلبات المكتملة</div>
  </div>
  <div class="stat amber">
    <div class="lbl">إجمالي الطلبات</div>
    <div class="val" id="stTotal">0</div>
    <div class="sub">منذ البداية</div>
  </div>
  <div class="stat red">
    <div class="lbl">الأكثر مبيعاً</div>
    <div class="val" id="stTop" style="font-size:18px">—</div>
    <div class="sub" id="stTopQty"></div>
  </div>
</div>

<!-- الأزرار -->
<div class="bar">
  <button class="primary" onclick="enableSound()" id="soundBtn">🔔 تفعيل التنبيه</button>
  <button onclick="addDemo()">🧪 طلب تجريبي</button>
  <button class="warn" onclick="clearAll()">🗑️ مسح الكل</button>
</div>

<!-- الطلبات -->
<div class="section-h">
  <span>الطلبات الواردة</span>
  <span class="count" id="ordCount">0</span>
</div>
<div class="orders" id="orders"></div>

<!-- شريط تفعيل الصوت -->
<div class="soundbar" id="soundbar">
  <span>🔇 فعّل التنبيه الصوتي عشان يزمّر الجهاز لما يجي طلب</span>
  <button onclick="enableSound()">تفعيل</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========================================================= */
/*  لوحة تحكم أسواق الفكهاني — تستقبل الطلبات وتزمّر          */
/*  مربوطة بـ Firebase: الطلبات توصل تلقائياً من الزبون      */
/* ========================================================= */

/* ===== ربط Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCo3tTfWuD2xZNbZevzQNtGZn8EXk1Ry1Q",
  authDomain: "aswaq-fakahani.firebaseapp.com",
  databaseURL: "https://aswaq-fakahani-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aswaq-fakahani",
  storageBucket: "aswaq-fakahani.firebasestorage.app",
  messagingSenderId: "901826915323",
  appId: "1:901826915323:web:87b41ea3e346e3e400395e"
};
let db = null, ordersRef = null;
try{
  if(typeof firebase !== "undefined"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    ordersRef = db.ref("orders");
  }
}catch(e){ console.warn("Firebase init failed:", e); }

let orders = [];        // كل الطلبات
let soundOn = false;    // هل التنبيه مفعّل
let audioCtx = null;
let firstLoad = true;   // لتجنّب الزمّور عند أول تحميل للطلبات القديمة

/* ---------- التنبيه الصوتي (بدون ملف صوت خارجي) ---------- */
function enableSound(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  soundOn = true;
  document.getElementById('soundbar').classList.remove('show');
  document.getElementById('soundBtn').textContent = '🔔 التنبيه مفعّل ✓';
  beep(); // تجربة صوت
  toast('تم تفعيل التنبيه 🔔');
}

function beep(){
  if(!soundOn||!audioCtx) return;
  // زمور متكرر 3 مرات
  const now = audioCtx.currentTime;
  for(let i=0;i<3;i++){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='sine';
    o.frequency.value = 880;
    const t = now + i*0.35;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.4,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.start(t); o.stop(t+0.3);
  }
  // اهتزاز لو الجهاز يدعم
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
}

/* ---------- الاستماع للطلبات من Firebase ---------- */
if(ordersRef){
  // تحميل كل الطلبات وترتيبها
  ordersRef.on('value', (snap)=>{
    const data = snap.val() || {};
    orders = Object.entries(data).map(([key,o])=>({...o, id:key}))
      .sort((a,b)=>(b.ts||0)-(a.ts||0));
    render();
  });

  // زمّور عند كل طلب جديد يضاف
  ordersRef.on('child_added', (snap)=>{
    if(firstLoad) return; // تجاهل الطلبات القديمة عند فتح اللوحة
    beep();
    toast('🆕 طلب جديد وصل!');
  });
  // بعد أول تحميل، فعّل الزمّور للطلبات الجديدة بس
  ordersRef.once('value', ()=>{ setTimeout(()=>{firstLoad=false;}, 1500); });
}

/* ---------- تغيير حالة الطلب (تنحفظ بالسحابة) ---------- */
function setStatus(id,st){
  if(!ordersRef){toast('غير متصل بالسحابة');return;}
  ordersRef.child(id).update({status:st});
}

function callCustomer(phone){
  window.open('tel:'+phone);
}

/* ---------- مسح كل الطلبات (من السحابة) ---------- */
function clearAll(){
  if(!ordersRef){toast('غير متصل بالسحابة');return;}
  if(confirm('متأكد بدك تمسح كل الطلبات؟ رح تنمسح نهائياً من كل الأجهزة.')){
    ordersRef.remove().then(()=>toast('تم المسح'));
  }
}

/* ---------- طلب تجريبي (يُرسل للسحابة) ---------- */
const demoNames=['أبو محمد','أم خالد','سامر','هدى','أبو علي','نور'];
const demoItems=[
  [{n:'بندورة',q:2,u:'الكيلو',p:0.18},{n:'خيار',q:1,u:'الكيلو',p:0.25},{n:'موز',q:1.5,u:'الكيلو',p:0.65}],
  [{n:'بطاطا',q:3,u:'الكيلو',p:0.35},{n:'بصل',q:2,u:'الكيلو',p:0.18},{n:'نعنع',q:2,u:'الضمة',p:0.25}],
  [{n:'تفاح أحمر إيطالي',q:2,u:'الكيلو',p:1.2},{n:'كوسا',q:1,u:'الكيلو',p:0.38}],
];
function addDemo(){
  if(!ordersRef){toast('غير متصل بالسحابة');return;}
  const items = demoItems[Math.floor(Math.random()*demoItems.length)];
  const sum = items.reduce((s,i)=>s+i.q*i.p,0);
  ordersRef.push({
    name: demoNames[Math.floor(Math.random()*demoNames.length)],
    phone: '0791234567',
    address: 'أبو نصير - شارع الملكة رانيا - عمارة 12',
    items: JSON.parse(JSON.stringify(items)),
    total: sum, status:'new',
    time:new Date().toISOString(), ts:Date.now()
  });
}

/* ---------- الرسم ---------- */
function timeAgo(iso){
  const d = (Date.now()-new Date(iso))/1000;
  if(d<60) return 'الآن';
  if(d<3600) return Math.floor(d/60)+' دقيقة';
  if(d<86400) return Math.floor(d/3600)+' ساعة';
  return Math.floor(d/86400)+' يوم';
}
function isToday(iso){
  const d=new Date(iso),n=new Date();
  return d.toDateString()===n.toDateString();
}

function render(){
  const wrap=document.getElementById('orders');
  document.getElementById('ordCount').textContent=orders.length;

  // الإحصائيات
  const today = orders.filter(o=>isToday(o.time));
  const pending = orders.filter(o=>o.status!=='done');
  const doneToday = today.filter(o=>o.status==='done');
  const salesToday = doneToday.reduce((s,o)=>s+o.total,0);
  document.getElementById('stToday').textContent=today.length;
  document.getElementById('stPending').textContent=pending.length+' قيد التنفيذ';
  document.getElementById('stSales').textContent=salesToday.toFixed(2);
  document.getElementById('stTotal').textContent=orders.length;

  // الأكثر مبيعاً
  const tally={};
  orders.forEach(o=>o.items.forEach(it=>{tally[it.n]=(tally[it.n]||0)+it.q;}));
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('stTop').textContent=top?top[0]:'—';
  document.getElementById('stTopQty').textContent=top?('بيعَ '+(+top[1].toFixed(1))+' وحدة'):'';

  if(!orders.length){
    wrap.innerHTML='<div class="empty"><div class="big">📭</div>ما في طلبات بعد<br>أول ما يجي طلب رح يزمّر الجهاز</div>';
    return;
  }

  wrap.innerHTML=orders.map(o=>{
    const badge = o.status==='done'?'<span class="badge b-done">مكتمل</span>'
      : o.status==='prep'?'<span class="badge b-prep">قيد التحضير</span>'
      : '<span class="badge b-new">جديد</span>';
    const rows=o.items.map(it=>
      `<div class="row"><span>${it.n} <span class="q">× ${(+it.q.toFixed(2))} ${it.u}</span></span>
       <span>${(it.q*it.p).toFixed(2)} د</span></div>`).join('');
    const acts = o.status==='done' ? '' : `
      <div class="acts">
        ${o.status!=='prep'?`<button class="prep" onclick="setStatus('${o.id}','prep')">👨‍🍳 قيد التحضير</button>`:''}
        <button class="call" onclick="callCustomer('${o.phone}')">📞 اتصل</button>
        <button class="done" onclick="setStatus('${o.id}','done')">✅ تم التوصيل</button>
      </div>`;
    return `<div class="order ${o.status==='new'?'new':''}">
      <div class="top">
        <div><div class="who">${o.name}</div><div class="time">${timeAgo(o.time)}</div></div>
        ${badge}
      </div>
      <div class="body">
        ${rows}
        <div class="tot"><span>المجموع</span><span>${o.total.toFixed(2)} دينار</span></div>
        <div class="meta">
          <span>📞 <a href="tel:${o.phone}">${o.phone}</a></span>
          <span>📍 ${o.address}</span>
        </div>
      </div>
      ${acts}
    </div>`;
  }).join('');
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- بدء التشغيل ---------- */
document.getElementById('soundbar').classList.add('show');
render();

/* تحديث الأوقات كل دقيقة */
setInterval(render,60000);
</script>
</body>
</html>
